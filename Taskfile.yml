version: "3"

silent: true

includes:
  apps:
    taskfile: ./taskfiles/applications.yml
  host:
    taskfile: ./taskfiles/host.yml
  image:
    taskfile: ./taskfiles/image.yml
  infra:
    taskfile: ./taskfiles/infrastructure.yml
  config:
    taskfile: ./taskfiles/configuration.yml
  data:
    taskfile: ./taskfiles/data.yml

tasks:
  default:
    desc: List available homelab tasks
    cmds:
      - task --list

  doctor:
    desc: Check tools, source files, credentials, and Proxmox API access
    cmds:
      - |
        set -eu
        for command in packer terraform ansible-playbook curl jq ssh ssh-keygen; do
          command -v "$command" >/dev/null 2>&1 || {
            echo "Missing required command: $command" >&2
            exit 1
          }
        done
        echo "Required tools are available."
      - |
        set -eu
        for path in \
          architecture.html \
          implementation.html \
          packer/images/ubuntu-26.04/config.pkr.hcl \
          packer/images/ubuntu-26.04/ubuntu-26.04.pkrvars.hcl \
          packer/seed/ubuntu/user-data.pkrtpl \
          taskfiles/scripts/packer-image.sh \
          taskfiles/scripts/verify-image.sh \
          taskfiles/scripts/inventory/generate.sh \
          taskfiles/scripts/app/gitea-bootstrap-secret.sh \
          taskfiles/scripts/app/adguard-bootstrap-secret.sh \
          taskfiles/scripts/app/adguard-rotate-password.sh \
          taskfiles/scripts/app/adguard-verify.sh \
          taskfiles/scripts/app/hermes-bootstrap-secret.py \
          taskfiles/scripts/host/terraform-mapping-role.sh \
          taskfiles/scripts/storage/verify-virtiofs.sh \
          taskfiles/scripts/storage/zfs.sh \
          taskfiles/host.yml \
          taskfiles/data.yml \
          taskfiles/applications.yml \
          terraform/image-verification/main.tf \
          terraform/image-verification/.terraform.lock.hcl \
          terraform/storage-verification/main.tf \
          terraform/storage-verification/.terraform.lock.hcl \
          terraform/providers.tf \
          terraform/keys/keys.pub \
          ansible/playbooks/site.yml \
          ansible/playbooks/common.yml \
          ansible/playbooks/cloudflare-ddns.yml \
          ansible/playbooks/caddy.yml \
          ansible/playbooks/gitea.yml \
          ansible/playbooks/adguard.yml \
          ansible/playbooks/adguard-rotate-password.yml \
          ansible/playbooks/hermes.yml \
          ansible/playbooks/hermes-git.yml \
          ansible/roles/adguard/defaults/main.yml \
          ansible/roles/adguard/tasks/main.yml \
          ansible/roles/adguard/files/reconcile.py \
          ansible/roles/adguard/files/rotate_password.py \
          ansible/roles/adguard/tasks/rotate-password.yml \
          ansible/roles/adguard/templates/compose.yml.j2 \
          ansible/roles/adguard/templates/policy.json.j2 \
          ansible/roles/adguard/templates/admin-backend.nft.j2 \
          ansible/roles/adguard/templates/homelab-adguard-admin-firewall.service.j2 \
          ansible/roles/adguard/templates/docker-firewall-dependency.conf.j2 \
          ansible/roles/adguard/tests/test_reconcile.py \
          ansible/roles/adguard/tests/test_rotate_password.py \
          ansible/roles/hermes/defaults/main.yml \
          ansible/roles/hermes/tasks/main.yml \
          ansible/roles/hermes/templates/compose.yml.j2 \
          ansible/roles/hermes/templates/config.yaml.j2 \
          ansible/roles/hermes/templates/dashboard-backend.nft.j2 \
          ansible/roles/hermes/templates/homelab-hermes-dashboard-firewall.service.j2 \
          ansible/roles/hermes/templates/docker-firewall-dependency.conf.j2 \
          ansible/roles/hermes-git/defaults/main.yml \
          ansible/roles/hermes-git/tasks/main.yml \
          ansible/roles/hermes-git/files/verify-telegram-gate.py \
          ansible/roles/hermes-git/templates/ssh-config.j2 \
          ansible/roles/hermes-git/templates/gitconfig.j2 \
          ansible/roles/hermes-git/templates/homelab-gitea.py.j2 \
          ansible/roles/hermes-git/templates/gitea-skill.md.j2 \
          ansible/roles/gitea-agent/defaults/main.yml \
          ansible/roles/gitea-agent/tasks/main.yml \
          ansible/roles/gitea-agent/files/reconcile-agent-identity.py \
          ansible/roles/caddy/tasks/main.yml \
          ansible/roles/caddy/templates/Dockerfile.j2 \
          ansible/roles/caddy/templates/Caddyfile.j2 \
          ansible/roles/caddy/templates/compose.yml.j2 \
          ansible/roles/cloudflare-ddns/tasks/main.yml \
          ansible/roles/cloudflare-ddns/templates/cloudflare-ddns.sh.j2 \
          ansible/roles/docker-engine/tasks/main.yml \
          ansible/roles/gitea/tasks/main.yml \
          ansible/roles/persistent-data/tasks/main.yml \
          ansible/inventories/homelab/hosts.example.yml; do
          test -f "$path" || {
            echo "Missing required file: $path" >&2
            exit 1
          }
        done
        echo "Required source files are present."
      - |
        set -eu
        require_value() {
          if [ -z "$2" ]; then
            echo "Missing required environment variable: $1" >&2
            exit 1
          fi
        }
        require_value PKR_VAR_proxmox_api_url "${PKR_VAR_proxmox_api_url:-}"
        require_value PKR_VAR_proxmox_user "${PKR_VAR_proxmox_user:-}"
        require_value PKR_VAR_node "${PKR_VAR_node:-}"
        if [ -z "${PKR_VAR_proxmox_token:-}" ] && [ -z "${PKR_VAR_proxmox_password:-}" ]; then
          echo "Set PKR_VAR_proxmox_token or PKR_VAR_proxmox_password." >&2
          exit 1
        fi
        require_value TF_VAR_pm_api_url "${TF_VAR_pm_api_url:-}"
        require_value TF_VAR_pm_api_token_id "${TF_VAR_pm_api_token_id:-}"
        require_value TF_VAR_pm_api_token_secret "${TF_VAR_pm_api_token_secret:-}"
        require_value TF_VAR_verification_node "${TF_VAR_verification_node:-}"
        require_value CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID:-}"
        require_value CLOUDFLARE_ACME_API_TOKEN "${CLOUDFLARE_ACME_API_TOKEN:-}"
        require_value CLOUDFLARE_DDNS_API_TOKEN "${CLOUDFLARE_DDNS_API_TOKEN:-}"
        require_value HOMELAB_DOMAIN "${HOMELAB_DOMAIN:-}"
        require_value CADDY_ACME_EMAIL "${CADDY_ACME_EMAIL:-}"
        echo "Required credential variables are loaded."
      - |
        set -eu
        printf 'header = "Authorization: PVEAPIToken=%s=%s"\n' \
          "$TF_VAR_pm_api_token_id" \
          "$TF_VAR_pm_api_token_secret" |
          curl \
            --config - \
            --silent \
            --show-error \
            --fail \
            --insecure \
            --output /dev/null \
            "${TF_VAR_pm_api_url%/}/nodes"
        echo "Proxmox API authentication succeeded."

  format:
    desc: Check Packer and Terraform formatting
    cmds:
      - task: image:format
      - terraform -chdir=terraform fmt -check -recursive

  validate:
    desc: Run every non-mutating repository validation
    cmds:
      - task: doctor
      - task: format
      - task: image:init
      - task: image:validate
      - terraform -chdir=terraform init -backend=false -input=false
      - terraform -chdir=terraform validate
      - terraform -chdir=terraform/image-verification init -backend=false -input=false
      - terraform -chdir=terraform/image-verification validate
      - terraform -chdir=terraform/storage-verification init -backend=false -input=false
      - terraform -chdir=terraform/storage-verification validate
      - task: config:validate
