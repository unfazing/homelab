---
- name: Rotate the AdGuard administrator password
  hosts: access
  become: true
  gather_facts: false
  vars:
    adguard_domain: "{{ lookup('ansible.builtin.env', 'HOMELAB_DOMAIN') }}"
  tasks:
    - name: Run the AdGuard-owned rotation workflow
      ansible.builtin.include_role:
        name: adguard
        tasks_from: rotate-password
