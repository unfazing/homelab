---
adguard_base_image: "adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0"
adguard_go_image: "golang:1.27.3-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c"
adguard_image: "homelab/adguard:0.107.79-go1.27.3-security-20261025"
adguard_compose_dir: /opt/homelab/adguard
adguard_data_dir: /srv/homelab/adguard
adguard_secret_dir: /etc/homelab/adguard
adguard_admin_password_file: ""
adguard_admin_username: server
adguard_domain: ""
adguard_dns_address: "{{ ansible_host }}"
adguard_admin_address: "{{ adguard_dns_address }}"
adguard_admin_port: 3000
adguard_proxy_address: "{{ hostvars[groups['services'][0]].ansible_host }}"
adguard_gitea_address: "{{ hostvars[groups['services'][0]].ansible_host }}"

# Non-secret policy transcribed from the existing 192.168.1.9 resolver.
# Admin credentials and query history are intentionally not copied.
adguard_policy:
  dns:
    upstream_dns:
      - https://dns.google/dns-query
      - https://dns10.quad9.net/dns-query
    bootstrap_dns:
      - 9.9.9.10
      - 149.112.112.10
      - "2620:fe::10"
      - "2620:fe::fe:10"
    fallback_dns: []
    upstream_mode: load_balance
    cache_size: 4194304
    cache_optimistic: false
    dnssec_enabled: false
    ratelimit: 20
  filtering:
    enabled: true
    interval: 24
    user_rules: []
  filters:
    - name: AdGuard DNS filter
      url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
      enabled: false
    - name: AdAway Default Blocklist
      url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt
      enabled: false
    - name: HaGeZi's Pro++ Blocklist
      url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_51.txt
      enabled: true
    - name: OISD Blocklist Big
      url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_27.txt
      enabled: true
    - name: OISD Blocklist Small
      url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_5.txt
      enabled: true
  rewrites:
    - domain: "adguard.home.{{ adguard_domain }}"
      answer: "{{ adguard_proxy_address }}"
    - domain: "gitea.home.{{ adguard_domain }}"
      answer: "{{ adguard_gitea_address }}"
    - domain: "hermes.home.{{ adguard_domain }}"
      answer: "{{ adguard_proxy_address }}"
    - domain: "inkling.home.{{ adguard_domain }}"
      answer: "{{ adguard_proxy_address }}"
    - domain: "dashboard.home.{{ adguard_domain }}"
      answer: "{{ adguard_proxy_address }}"
    - domain: "wireguard.home.{{ adguard_domain }}"
      answer: "{{ adguard_proxy_address }}"
    - domain: "s3.home.{{ adguard_domain }}"
      answer: "{{ adguard_proxy_address }}"
    - domain: "garage.home.{{ adguard_domain }}"
      answer: "{{ adguard_proxy_address }}"
  querylog:
    enabled: true
    interval: 7776000000
  statistics:
    enabled: true
    interval: 86400000
