---
- name: Install AdGuard Home prerequisites
  ansible.builtin.apt:
    name:
      - apache2-utils
      - curl
      - unzip
    update_cache: true
    state: present

- name: Create AdGuard Home state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/lab-access/secrets, mode: "0700" }
    - { path: /opt/AdGuardHome/conf, mode: "0755" }

- name: Install AdGuard Home when absent
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/master/scripts/install.sh | sh -s -- -v
  args:
    executable: /bin/bash
    creates: /opt/AdGuardHome/AdGuardHome

- name: Generate the AdGuard Home administrator password when absent
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    tr -dc 'A-Za-z0-9' </dev/urandom | head -c 24 >/var/lib/lab-access/secrets/adguard-admin-password.txt
  args:
    executable: /bin/bash
    creates: /var/lib/lab-access/secrets/adguard-admin-password.txt
  no_log: true

- name: Read the AdGuard Home administrator password
  ansible.builtin.slurp:
    src: /var/lib/lab-access/secrets/adguard-admin-password.txt
  register: adguard_password_file
  no_log: true

- name: Hash the AdGuard Home administrator password
  ansible.builtin.command:
    argv:
      - htpasswd
      - -bnBC
      - "10"
      - ""
      - "{{ adguard_password_file.content | b64decode | trim }}"
  register: adguard_htpasswd
  changed_when: false
  no_log: true

- name: Render the AdGuard Home configuration
  ansible.builtin.copy:
    dest: /opt/AdGuardHome/conf/AdGuardHome.yaml
    mode: "0600"
    content: |
      http:
        address: {{ adguard_http_address }}
      users:
        - name: admin
          password: {{ adguard_htpasswd.stdout | regex_replace('^:', '') | trim }}
      dns:
        bind_hosts:
          - 0.0.0.0
        port: 53
        upstream_dns:
      {% for upstream in adguard_upstream_dns %}
          - {{ upstream }}
      {% endfor %}
        bootstrap_dns:
      {% for upstream in adguard_upstream_dns %}
          - {{ upstream }}
      {% endfor %}
      schema_version: 28
  no_log: true
  notify: Restart AdGuard Home

- name: Enable AdGuard Home
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: true
    state: started
