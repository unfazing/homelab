---
- name: Validate the guarded AdGuard password-rotation inputs
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - adguard_domain is match('^[a-z0-9.-]+$')
      - adguard_expected_current_password_file | length > 0
      - adguard_new_password_file | length > 0
      - adguard_admin_username is match('^[a-zA-Z0-9_.-]+$')
    fail_msg: "Rotation requires two local secret files, a private domain, and a live guest."
    quiet: true

- name: Install the bcrypt hashing utility for AdGuard password rotation
  ansible.builtin.apt:
    name: apache2-utils
    state: present

- name: Install the AdGuard-owned rotation helper
  ansible.builtin.copy:
    src: rotate_password.py
    dest: "{{ adguard_compose_dir }}/rotate_password.py"
    owner: root
    group: root
    mode: "0750"

- name: Stage credentials and perform guarded AdGuard rotation
  block:
    - name: Stage the expected current administrator password
      ansible.builtin.copy:
        src: "{{ adguard_expected_current_password_file }}"
        dest: "{{ adguard_secret_dir }}/admin-password.expected"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Stage the replacement administrator password
      ansible.builtin.copy:
        src: "{{ adguard_new_password_file }}"
        dest: "{{ adguard_secret_dir }}/admin-password.next"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Rotate the durable password with guest-side rollback
      ansible.builtin.command:
        argv:
          - python3
          - "{{ adguard_compose_dir }}/rotate_password.py"
          - --current-password-file
          - "{{ adguard_secret_dir }}/admin-password"
          - --expected-password-file
          - "{{ adguard_secret_dir }}/admin-password.expected"
          - --new-password-file
          - "{{ adguard_secret_dir }}/admin-password.next"
          - --config-file
          - "{{ adguard_data_dir }}/conf/AdGuardHome.yaml"
          - --backup-file
          - "{{ adguard_secret_dir }}/AdGuardHome.yaml.pre-rotation"
          - --compose-dir
          - "{{ adguard_compose_dir }}"
          - --username
          - "{{ adguard_admin_username }}"
          - --web-address
          - "{{ adguard_admin_address }}"
          - --web-port
          - "{{ adguard_admin_port | string }}"
          - --dns-address
          - "{{ adguard_dns_address }}"
          - --verify-name
          - "adguard.home.{{ adguard_domain }}"
          - --expected-ip
          - "{{ adguard_proxy_address }}"
      changed_when: true
  always:
    - name: Remove staged rotation credentials from the access VM
      ansible.builtin.file:
        path: "{{ adguard_secret_dir }}/{{ item }}"
        state: absent
      loop:
        - admin-password.expected
        - admin-password.next
      no_log: true
