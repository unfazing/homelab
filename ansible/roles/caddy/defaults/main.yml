caddy_adguard_hostname: "adguard.home.{{ caddy_domain }}"
caddy_adguard_upstream: "http://{{ hostvars[groups['access'][0]].ansible_host }}:3000"
caddy_hermes_hostname: "hermes.home.{{ caddy_domain }}"
caddy_hermes_upstream: "http://{{ hostvars[groups['agents'][0]].ansible_host }}:9119"
caddy_inkling_hostname: "inkling.home.{{ caddy_domain }}"
caddy_inkling_upstream: http://192.168.1.9:3000
caddy_homepage_enabled: true
caddy_storage_enabled: true
caddy_s3_hostname: "s3.home.{{ caddy_domain }}"
caddy_s3_upstream: http://192.168.1.9:3900
caddy_garage_hostname: "garage.home.{{ caddy_domain }}"
caddy_garage_upstream: http://192.168.1.9:3909
