---
- name: Validate the temporary worker contract
  ansible.builtin.assert:
    that:
      - ansible_host == '192.168.1.9'
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['architecture'] == 'x86_64'
      - gitea_runner_scope == 'lab-agents-org'
      - gitea_runner_url is match('^https://gitea\.home\.[a-z0-9.-]+$')
      - gitea_runner_sha256 is match('^[a-f0-9]{64}$')
    quiet: true

- name: Read the installed Docker CE version before changing its rootless tools
  ansible.builtin.command:
    argv: [dpkg-query, --show, '--showformat=${Version}', docker-ce]
  register: runner_docker_ce_version
  changed_when: false

- name: Require an installed official Docker CE package
  ansible.builtin.assert:
    that:
      - runner_docker_ce_version.stdout is match('^[0-9]+:[0-9][A-Za-z0-9.+:~_-]+$')
    fail_msg: Install official Docker CE before provisioning this external worker.
    quiet: true

- name: Remove the conflicting Ubuntu rootlesskit package only
  ansible.builtin.apt:
    name: rootlesskit
    state: absent
    autoremove: false

- name: Install rootless prerequisites and Docker-matched rootless tools
  ansible.builtin.apt:
    name:
      - "docker-ce-rootless-extras={{ runner_docker_ce_version.stdout }}"
      - uidmap
      - dbus-user-session
      - slirp4netns
      - nftables
      - git
      - openssh-client
      - acl
    state: present
    update_cache: true
    cache_valid_time: 3600
    fail_on_autoremove: true

- name: Require the existing Docker rootless setup helper
  ansible.builtin.command:
    argv: [test, -x, /usr/bin/dockerd-rootless-setuptool.sh]
  changed_when: false

- name: Prepare separate runtime users and their limits
  ansible.builtin.include_tasks: runtime.yml
  loop:
    - { user: "{{ gitea_runner_user }}", home: "{{ gitea_runner_home }}", key: ci }
    - { user: "{{ gitea_deploy_user }}", home: "{{ gitea_deploy_home }}", key: deploy }
  loop_control:
    loop_var: runtime

- name: Create protected installer directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: [/etc/homelab-runner, /etc/homelab-deploy, /usr/local/libexec, /opt/homelab/runner-tools]

- name: Install only the scoped egress table loader
  ansible.builtin.copy:
    src: load-egress.py
    dest: /usr/local/libexec/homelab-runner-egress
    mode: '0755'

- name: Render the worker egress boundary
  ansible.builtin.template:
    src: egress.nft.j2
    dest: /etc/homelab-runner/egress.nft
    mode: '0644'
  register: runner_egress_rules

- name: Install the egress service
  ansible.builtin.template:
    src: egress.service.j2
    dest: /etc/systemd/system/homelab-runner-egress.service
    mode: '0644'

- name: Enable and start policy before either runtime
  ansible.builtin.systemd_service:
    name: homelab-runner-egress
    daemon_reload: true
    enabled: true
    state: started

- name: Assert live policy even if a manual firewall reload removed the table
  ansible.builtin.command:
    argv: [/usr/local/libexec/homelab-runner-egress]
  # Atomic replace converges the same table without duplicate rules.
  changed_when: runner_egress_rules.changed

- name: Start each isolated rootless daemon
  ansible.builtin.include_tasks: start-runtime.yml
  loop:
    - { user: "{{ gitea_runner_user }}", home: "{{ gitea_runner_home }}", uid: "{{ gitea_runner_ci_uid }}" }
    - { user: "{{ gitea_deploy_user }}", home: "{{ gitea_deploy_home }}", uid: "{{ gitea_runner_deploy_uid }}" }
  loop_control:
    loop_var: runtime

- name: Download the checksum-pinned native runner
  ansible.builtin.get_url:
    url: "https://dl.gitea.com/gitea-runner/{{ gitea_runner_version }}/gitea-runner-{{ gitea_runner_version }}-linux-amd64"
    dest: /usr/local/bin/gitea-runner
    checksum: "sha256:{{ gitea_runner_sha256 }}"
    # The upstream CDN rejects Python/Ansible's default user agent (403).
    http_agent: curl/8.5.0
    mode: '0755'
  register: runner_binary

- name: Render the runner configuration
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/homelab-runner/config.yml
    group: "{{ gitea_runner_user }}"
    mode: '0640'
  register: runner_configuration

- name: Install the runner user service
  ansible.builtin.template:
    src: runner.service.j2
    dest: "{{ gitea_runner_home }}/.config/systemd/user/gitea-runner.service"
    owner: root
    group: "{{ gitea_runner_user }}"
    mode: '0640'
  register: runner_unit

- name: Render the pinned Docker-enabled job tool image
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: /opt/homelab/runner-tools/Dockerfile
    mode: '0644'
  register: runner_tools_source

- name: Inspect the CI tool image in the CI daemon only
  ansible.builtin.command:
    argv: [docker, image, inspect, "{{ gitea_runner_job_image }}"]
  become_user: "{{ gitea_runner_user }}"
  environment:
    HOME: "{{ gitea_runner_home }}"
    DOCKER_HOST: "unix:///run/user/{{ gitea_runner_ci_uid }}/docker.sock"
  register: runner_tools_image
  changed_when: false
  failed_when: runner_tools_image.rc not in [0, 1]

- name: Build CI tools without using the rootful application daemon
  ansible.builtin.command:
    argv: [docker, build, --tag, "{{ gitea_runner_job_image }}", /opt/homelab/runner-tools]
  become_user: "{{ gitea_runner_user }}"
  environment:
    HOME: "{{ gitea_runner_home }}"
    DOCKER_HOST: "unix:///run/user/{{ gitea_runner_ci_uid }}/docker.sock"
  when: runner_tools_image.rc == 1 or runner_tools_source.changed
  changed_when: true

- name: Install the contract-only deployment interface
  ansible.builtin.copy:
    src: deploy.py
    dest: /usr/local/libexec/homelab-deploy
    mode: '0755'

- name: Protect deployment SSH policy from the runtime user
  ansible.builtin.file:
    path: "{{ gitea_deploy_home }}/.ssh"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install explicitly admitted application contracts
  ansible.builtin.include_tasks: contract.yml
  loop: "{{ gitea_runner_app_contracts }}"
  loop_control:
    loop_var: app

- name: Allow only admitted per-application SSH keys and forced commands
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "{{ gitea_deploy_home }}/.ssh/authorized_keys"
    owner: root
    group: root
    mode: '0644'

- name: Run foundation boundary checks before enrollment
  ansible.builtin.include_tasks: verify.yml
