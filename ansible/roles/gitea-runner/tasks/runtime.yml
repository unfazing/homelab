---
- name: Prepare a shared rootless runtime with the runner egress dependency
  ansible.builtin.include_role:
    name: rootless-runtime
    tasks_from: prepare
  vars:
    rootless_user: "{{ runtime.user }}"
    rootless_home: "{{ runtime.home }}"
    rootless_required_units: [homelab-runner-egress.service]
    rootless_memory_max: "{{ gitea_runner_memory_max }}"
    rootless_cpu_quota: "{{ gitea_runner_cpu_quota }}"

- name: Remember the role-specific runtime identity
  ansible.builtin.set_fact:
    "gitea_runner_{{ runtime.key }}_uid": "{{ rootless_uid }}"
