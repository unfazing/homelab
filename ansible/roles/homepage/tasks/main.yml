---
- name: Validate the Homepage contract
  ansible.builtin.import_tasks: validate.yml
- name: Create the Homepage project and configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ homepage_uid }}"
    mode: '0750'
  loop:
    - "{{ homepage_compose_dir }}"
    - "{{ homepage_compose_dir }}/config"
    - "{{ homepage_compose_dir }}/config/logs"
    - "{{ homepage_secret_dir }}"
- name: Install the Homepage-owned observer provisioner
  ansible.builtin.copy:
    src: provision-gitea.py
    dest: "{{ homepage_compose_dir }}/provision-gitea.py"
    owner: root
    group: root
    mode: '0700'
- name: Provision the Gitea observer without touching repository grants
  ansible.builtin.copy:
    src: "{{ homepage_gitea_token_file }}"
    dest: "{{ homepage_secret_dir }}/gitea-token"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
    force: false
  no_log: true
  when: lookup('ansible.builtin.fileglob', homepage_gitea_token_file) | length > 0
- name: Provision the Gitea observer and bounded token
  ansible.builtin.command: "python3 {{ homepage_compose_dir }}/provision-gitea.py"
  register: homepage_gitea_identity
  changed_when: (homepage_gitea_identity.stdout | from_json).changed
  no_log: true
  when: not ansible_check_mode
- name: Preserve the observer credential for VM reconstruction
  ansible.builtin.slurp:
    src: "{{ homepage_secret_dir }}/gitea-token"
  register: homepage_gitea_recovery
  no_log: true
  when: not ansible_check_mode
- name: Keep an ignored controller recovery copy outside the disposable guest
  ansible.builtin.copy:
    content: "{{ homepage_gitea_recovery.content | b64decode }}"
    dest: "{{ homepage_gitea_token_file }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
  when: not ansible_check_mode
- name: Permit only the Homepage UID to read its Gitea token
  ansible.builtin.file:
    path: "{{ homepage_secret_dir }}/gitea-token"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  when: not ansible_check_mode
- name: Install only Homepage's Proxmox observer token
  ansible.builtin.copy:
    content: "{{ hostvars['homepage-blue'].homepage_pve_token.content | b64decode | trim }}"
    dest: "{{ homepage_secret_dir }}/proxmox-token"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  no_log: true
  when: not ansible_check_mode
- name: Install the public Proxmox CA for verified TLS
  ansible.builtin.copy:
    content: "{{ hostvars['homepage-blue'].homepage_pve_ca.content | b64decode }}"
    dest: "{{ homepage_secret_dir }}/proxmox-ca.pem"
    owner: root
    group: "{{ homepage_uid }}"
    mode: '0640'
  when: not ansible_check_mode
- name: Install the separately scoped AdGuard credential
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', homepage_adguard_password_file) | trim }}"
    dest: "{{ homepage_secret_dir }}/adguard-password"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  no_log: true
- name: Check existing native login recovery fingerprints
  ansible.builtin.stat:
    path: "{{ homepage_secret_dir }}/{{ item }}"
    checksum_algorithm: sha256
  loop: [dashboard-password, session-secret]
  register: homepage_native_existing
  no_log: true
- name: Compare controller recovery sources without displaying their values
  ansible.builtin.set_fact:
    homepage_native_recovery_valid: >-
      {{ (not homepage_native_existing.results[0].stat.exists or
          homepage_native_existing.results[0].stat.checksum == (lookup('ansible.builtin.file', homepage_password_file) | trim | hash('sha256'))) and
         (not homepage_native_existing.results[1].stat.exists or
          homepage_native_existing.results[1].stat.checksum == (lookup('ansible.builtin.file', homepage_session_secret_file) | trim | hash('sha256'))) }}
  no_log: true
- name: Refuse silent replacement of an existing native login or session secret
  ansible.builtin.assert:
    that: homepage_native_recovery_valid | bool
    fail_msg: Restore the matching controller Homepage password/session recovery files; changing an existing login requires deliberate rotation
    quiet: true
- name: Install persistent native authentication secrets without Compose environment values
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item.source) | trim }}"
    dest: "{{ homepage_secret_dir }}/{{ item.name }}"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  loop:
    - {name: dashboard-password, source: "{{ homepage_password_file }}"}
    - {name: session-secret, source: "{{ homepage_session_secret_file }}"}
  no_log: true
- name: Converge configuration using the installed identities
  ansible.builtin.import_tasks: configuration.yml
