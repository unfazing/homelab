---
- name: Validate the private Homepage deployment contract
  ansible.builtin.assert:
    that:
      - homepage_domain is match('^[a-z0-9.-]+$')
      - homepage_image is match('^ghcr.io/gethomepage/homepage:v[0-9.]+@sha256:[a-f0-9]{64}$')
      - homepage_proxy_subnet == '172.30.90.0/29'
      - homepage_uid == '10001'
    quiet: true
- name: Create the Homepage project and configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ homepage_uid }}"
    mode: '0750'
  loop:
    - "{{ homepage_compose_dir }}"
    - "{{ homepage_compose_dir }}/config"
    - "{{ homepage_compose_dir }}/config/logs"
    - "{{ homepage_secret_dir }}"
- name: Install the Homepage-owned observer provisioner
  ansible.builtin.copy:
    src: provision-gitea.py
    dest: "{{ homepage_compose_dir }}/provision-gitea.py"
    owner: root
    group: root
    mode: '0700'
- name: Install the verified TLS compatibility guard for upstream widget agents
  ansible.builtin.copy:
    src: verified-tls.cjs
    dest: "{{ homepage_compose_dir }}/verified-tls.cjs"
    owner: root
    group: root
    mode: '0644'
  register: homepage_tls_guard
- name: Provision the Gitea observer without touching repository grants
  ansible.builtin.copy:
    src: "{{ homepage_gitea_token_file }}"
    dest: "{{ homepage_secret_dir }}/gitea-token"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
    force: false
  no_log: true
  when: lookup('ansible.builtin.fileglob', homepage_gitea_token_file) | length > 0
- name: Provision the Gitea observer and bounded token
  ansible.builtin.command: "python3 {{ homepage_compose_dir }}/provision-gitea.py"
  register: homepage_gitea_identity
  changed_when: (homepage_gitea_identity.stdout | from_json).changed
  no_log: true
  when: not ansible_check_mode
- name: Preserve the observer credential for VM reconstruction
  ansible.builtin.slurp:
    src: "{{ homepage_secret_dir }}/gitea-token"
  register: homepage_gitea_recovery
  no_log: true
  when: not ansible_check_mode
- name: Keep an ignored controller recovery copy outside the disposable guest
  ansible.builtin.copy:
    content: "{{ homepage_gitea_recovery.content | b64decode }}"
    dest: "{{ homepage_gitea_token_file }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
  when: not ansible_check_mode
- name: Permit only the Homepage UID to read its Gitea token
  ansible.builtin.file:
    path: "{{ homepage_secret_dir }}/gitea-token"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  when: not ansible_check_mode
- name: Install only Homepage's Proxmox observer token
  ansible.builtin.copy:
    content: "{{ hostvars['homepage-blue'].homepage_pve_token.content | b64decode | trim }}"
    dest: "{{ homepage_secret_dir }}/proxmox-token"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  no_log: true
  when: not ansible_check_mode
- name: Install the public Proxmox CA for verified TLS
  ansible.builtin.copy:
    content: "{{ hostvars['homepage-blue'].homepage_pve_ca.content | b64decode }}"
    dest: "{{ homepage_secret_dir }}/proxmox-ca.pem"
    owner: root
    group: "{{ homepage_uid }}"
    mode: '0640'
  when: not ansible_check_mode
- name: Install the separately scoped AdGuard credential
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', homepage_adguard_password_file) | trim }}"
    dest: "{{ homepage_secret_dir }}/adguard-password"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  no_log: true
- name: Check existing native login recovery fingerprints
  ansible.builtin.stat:
    path: "{{ homepage_secret_dir }}/{{ item }}"
    checksum_algorithm: sha256
  loop: [dashboard-password, session-secret]
  register: homepage_native_existing
  no_log: true
- name: Compare controller recovery sources without displaying their values
  ansible.builtin.set_fact:
    homepage_native_recovery_valid: >-
      {{ (not homepage_native_existing.results[0].stat.exists or
          homepage_native_existing.results[0].stat.checksum == (lookup('ansible.builtin.file', homepage_password_file) | trim | hash('sha256'))) and
         (not homepage_native_existing.results[1].stat.exists or
          homepage_native_existing.results[1].stat.checksum == (lookup('ansible.builtin.file', homepage_session_secret_file) | trim | hash('sha256'))) }}
  no_log: true
- name: Refuse silent replacement of an existing native login or session secret
  ansible.builtin.assert:
    that: homepage_native_recovery_valid | bool
    fail_msg: Restore the matching controller Homepage password/session recovery files; changing an existing login requires deliberate rotation
    quiet: true
- name: Install persistent native authentication secrets without Compose environment values
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', item.source) | trim }}"
    dest: "{{ homepage_secret_dir }}/{{ item.name }}"
    owner: "{{ homepage_uid }}"
    group: "{{ homepage_uid }}"
    mode: '0600'
  loop:
    - {name: dashboard-password, source: "{{ homepage_password_file }}"}
    - {name: session-secret, source: "{{ homepage_session_secret_file }}"}
  no_log: true
- name: Install the read-only infrastructure collector
  ansible.builtin.include_tasks: observer.yml
- name: Check widget credential fingerprints without displaying contents
  ansible.builtin.stat:
    path: "{{ homepage_secret_dir }}/{{ item }}"
    checksum_algorithm: sha256
  loop: [proxmox-token, gitea-token, adguard-password, proxmox-ca.pem, dashboard-password, session-secret]
  register: homepage_secret_stats
- name: Derive a restart marker for changed widget credentials
  ansible.builtin.set_fact:
    homepage_secrets_checksum: "{{ homepage_secret_stats.results | map(attribute='stat.checksum') | join('') | hash('sha256') }}"
  when: homepage_secret_stats.results | selectattr('stat.exists') | list | length == 6
- name: Create the dedicated proxy network
  ansible.builtin.include_tasks: network.yml
- name: Render Homepage configuration without inline secrets
  ansible.builtin.template:
    src: "{{ item }}.yaml.j2"
    dest: "{{ homepage_compose_dir }}/config/{{ item }}.yaml"
    owner: root
    group: "{{ homepage_uid }}"
    mode: '0640'
  loop: [settings, services, proxmox, bookmarks, widgets]
- name: Supply empty optional configuration files
  ansible.builtin.copy:
    content: "{}\n"
    dest: "{{ homepage_compose_dir }}/config/{{ item }}.yaml"
    owner: root
    group: "{{ homepage_uid }}"
    mode: '0640'
  loop: [docker, kubernetes]
- name: Seed optional frontend files before mounting configuration read-only
  ansible.builtin.copy:
    content: ''
    dest: "{{ homepage_compose_dir }}/config/{{ item }}"
    owner: root
    group: "{{ homepage_uid }}"
    mode: '0640'
  loop: [custom.css, custom.js]
- name: Compute the non-secret configuration checksum
  ansible.builtin.set_fact:
    homepage_config_checksum: "{{ (lookup('ansible.builtin.template', 'settings.yaml.j2') ~ lookup('ansible.builtin.template', 'services.yaml.j2') ~ lookup('ansible.builtin.template', 'proxmox.yaml.j2') ~ lookup('ansible.builtin.template', 'widgets.yaml.j2') ~ lookup('ansible.builtin.template', 'bookmarks.yaml.j2') ~ lookup('ansible.builtin.file', role_path ~ '/files/verified-tls.cjs')) | hash('sha256') }}"
- name: Render the isolated Homepage Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ homepage_compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: '0640'
- name: Pull the immutable Homepage image
  ansible.builtin.command:
    argv: [docker, image, pull, "{{ homepage_image }}"]
  register: homepage_pull
  changed_when: "'Downloaded newer image' in homepage_pull.stdout"
  when: not ansible_check_mode
- name: Validate the Homepage Compose project
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --read-only
      - --user
      - "{{ homepage_uid }}:{{ homepage_uid }}"
      - --volume
      - "{{ homepage_compose_dir }}/config:/app/config:ro"
      - --volume
      - "{{ homepage_secret_dir }}:/run/secrets:ro"
      - --entrypoint
      - node
      - "{{ homepage_image }}"
      - -e
      - |
        const fs = require('fs'), yaml = require('js-yaml');
        const files = {PROXMOX_TOKEN:'proxmox-token', GITEA_TOKEN:'gitea-token', ADGUARD_PASSWORD:'adguard-password'};
        try {
          for (const name of ['settings','services','proxmox','bookmarks','widgets','docker','kubernetes']) {
            const text = fs.readFileSync('/app/config/'+name+'.yaml', 'utf8').replace(/\{\{HOMEPAGE_FILE_([A-Z_]+)\}\}/g, (_, key) => {
              const value = fs.readFileSync('/run/secrets/'+files[key], 'utf8');
              if (value !== value.trim() || !value) throw Error('Invalid file secret');
              return value;
            });
            yaml.load(text);
          }
        } catch (_) { console.error('Homepage YAML or file-secret validation failed'); process.exit(1); }
  changed_when: false
  when: not ansible_check_mode
- name: Validate the rendered Compose model
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ homepage_compose_dir }}", config, --quiet]
  changed_when: false
  when: not ansible_check_mode
- name: Converge Homepage without publishing a host port
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ homepage_compose_dir }}", up, --detach, --wait, --wait-timeout, '120']
  register: homepage_up
  changed_when: "'Created' in homepage_up.stderr or 'Started' in homepage_up.stderr or 'Recreated' in homepage_up.stderr"
  when: not ansible_check_mode
- name: Confirm native API protection before removing the old edge gate
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - homepage
      - node
      - -e
      - |
        const http=require('http');
        let tries=0;
        function probe(){http.get('http://127.0.0.1:3000/api/services',
          {headers:{Host:process.env.HOMEPAGE_ALLOWED_HOSTS}},r=>{
            r.resume(); if(r.statusCode!==307 || !r.headers.location?.startsWith('/auth/signin'))process.exit(1);
          }).on('error',()=>{if(++tries<20)setTimeout(probe,1000);else process.exit(1)});}
        probe();
  changed_when: false
  when: not ansible_check_mode
