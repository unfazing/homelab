---
postgresql_image: "postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8"
postgresql_container_name: homelab-postgresql
postgresql_compose_dir: /opt/homelab/postgresql
postgresql_secret_dir: /etc/homelab/storage
postgresql_policy_file: /etc/homelab/storage/postgresql-policy.json
postgresql_port: 5432
postgresql_memory_limit: 1g
postgresql_cpu_limit: "1.0"
postgresql_max_connections: 30
