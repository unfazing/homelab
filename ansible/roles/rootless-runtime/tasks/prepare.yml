---
- name: Create the rootless runtime account
  ansible.builtin.user:
    name: "{{ rootless_user }}"
    home: "{{ rootless_home }}"
    shell: /bin/bash
    password_lock: true
    create_home: true

- name: Read the runtime UID
  ansible.builtin.command:
    argv: [id, -u, "{{ rootless_user }}"]
  register: runtime_uid
  changed_when: false

- name: Remember the runtime identity
  ansible.builtin.set_fact:
    rootless_uid: "{{ runtime_uid.stdout | int }}"

- name: Require a subordinate ID allocation for rootless Docker
  ansible.builtin.shell: |
    set -eu
    for file in /etc/subuid /etc/subgid; do
      awk -F: -v name="$RUNTIME_USER" '$1 == name && $3 >= 65536 {found=1} END {exit !found}' "$file"
    done
  environment:
    RUNTIME_USER: "{{ rootless_user }}"
  changed_when: false

- name: Protect the top-level home from SSH command-policy replacement
  ansible.builtin.file:
    path: "{{ rootless_home }}"
    owner: root
    group: "{{ rootless_user }}"
    mode: '0750'

- name: Create writable rootless state below the protected home
  ansible.builtin.file:
    path: "{{ rootless_home }}/{{ item }}"
    state: directory
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: '0700'
  loop: [.config, .config/systemd, .config/systemd/user, .config/docker, .local, .cache, .docker, state, releases]

- name: Limit rootless daemon logs and use the approved resolver
  ansible.builtin.copy:
    content: '{"dns":["192.168.1.100"],"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}'
    dest: "{{ rootless_home }}/.config/docker/daemon.json"
    owner: root
    group: "{{ rootless_user }}"
    mode: '0640'
  register: rootless_daemon_configuration

- name: Remember daemon configuration changes separately for each runtime
  ansible.builtin.set_fact:
    rootless_daemon_changes: "{{ rootless_daemon_changes | default({}) | combine({rootless_user: rootless_daemon_configuration.changed}) }}"

- name: Create the root-owned user-manager dependency override directory
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ rootless_uid }}.service.d"
    state: directory
    mode: '0755'

- name: Install required system-service dependencies before starting this runtime
  ansible.builtin.template:
    src: user-dependency.conf.j2
    dest: "/etc/systemd/system/user@{{ rootless_uid }}.service.d/homelab-egress.conf"
    mode: '0644'

- name: Converge this whole user's resource budget
  ansible.builtin.include_tasks: limits.yml
