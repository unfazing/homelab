---
- name: Inspect the isolated telemetry network
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ storage_observer_network }}"]
  become_user: "{{ storage_runtime_user }}"
  environment: "{{ storage_runtime_environment }}"
  register: storage_observer_net
  changed_when: false
  failed_when: storage_observer_net.rc not in [0, 1]

- name: Create a telemetry-only bridge without external egress
  ansible.builtin.command:
    argv: [docker, network, create, --internal, --subnet, "{{ storage_observer_subnet }}", "{{ storage_observer_network }}"]
  become_user: "{{ storage_runtime_user }}"
  environment: "{{ storage_runtime_environment }}"
  when: storage_observer_net.rc == 1
  changed_when: true

- name: Reject a conflicting existing network
  ansible.builtin.assert:
    that:
      - (storage_observer_net.stdout | from_json)[0].Internal
      - (storage_observer_net.stdout | from_json)[0].IPAM.Config[0].Subnet == storage_observer_subnet
    quiet: true
  when: storage_observer_net.rc == 0
