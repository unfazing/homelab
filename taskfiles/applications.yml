version: "3"

silent: true

vars:
  INVENTORY: .generated/ansible/hosts.json
  LOCAL_TEMP: .generated/ansible/tmp
  GITEA_SECRET_FILE: .generated/secrets/gitea-admin-password
  ACME_STAGING_CA: https://acme-staging-v02.api.letsencrypt.org/directory
  ACME_PRODUCTION_CA: https://acme-v02.api.letsencrypt.org/directory

env:
  ANSIBLE_CONFIG: ansible/ansible.cfg
  ANSIBLE_LOCAL_TEMP: "{{.LOCAL_TEMP}}"

tasks:
  storage:secrets:
    internal: true
    cmds:
      - python3 taskfiles/scripts/app/storage-secrets.py

  storage:validate:
    desc: Validate storage safety guards, service roles and Ansible deployment wiring
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - python3 -m unittest discover -s ansible/roles/storage-runtime/tests -v
      - python3 -m unittest discover -s ansible/roles/postgresql/tests -v
      - python3 -m unittest discover -s ansible/roles/garage/tests -v
      - python3 -m unittest discover -s ansible/roles/garage-ui/tests -v
      - python3 -m unittest discover -s ansible/roles/storage-observer/tests -v
      - >-
        ansible-playbook --syntax-check
        -i ansible/inventories/homelab/hosts.example.yml
        -i ansible/inventories/external/hosts.yml
        ansible/playbooks/storage.yml
      - >-
        ansible-playbook --syntax-check
        -i ansible/inventories/homelab/hosts.example.yml
        -i ansible/inventories/external/hosts.yml
        ansible/playbooks/storage-verify.yml
      - >-
        ansible-playbook --syntax-check
        -i ansible/inventories/homelab/hosts.example.yml
        -i ansible/inventories/external/hosts.yml
        ansible/playbooks/storage-monitoring.yml
      - task: runner:validate
      - task: homepage:validate

  storage:deploy:
    vars:
      STORAGE_VERIFY_RESTART: '{{.VERIFY_RESTART | default "false"}}'
    desc: Install PostgreSQL Garage and authenticated Garage UI with a hidden red sudo prompt
    deps: [":config:inventory", "adguard:domain", "caddy:credentials", "homepage:secrets", "storage:secrets"]
    preconditions:
      - sh: test -s .generated/secrets/adguard-admin-password && test ! -e .generated/secrets/.adguard-rotate.lock
        msg: Existing AdGuard credentials are required; do not deploy during password rotation
    cmds:
      - task: storage:validate
      - >-
        ansible-playbook --ask-become-pass
        -i "{{.INVENTORY}}" -i ansible/inventories/external/hosts.yml
        -e "garage_ui_verify_restart={{.STORAGE_VERIFY_RESTART}}"
        ansible/playbooks/storage.yml

  storage:monitoring:deploy:
    desc: Converge restricted storage metrics and Homepage on existing services with a hidden red sudo prompt
    deps: [":config:inventory", "adguard:domain", "caddy:credentials", "homepage:secrets", "storage:secrets"]
    cmds:
      - task: storage:validate
      - >-
        ansible-playbook --ask-become-pass
        -i "{{.INVENTORY}}" -i ansible/inventories/external/hosts.yml
        ansible/playbooks/storage-monitoring.yml

  storage:verify:
    vars:
      STORAGE_VERIFY_RESTART: '{{.VERIFY_RESTART | default "false"}}'
    desc: Verify existing data mounts service authentication and private storage boundaries
    deps: [":config:inventory", "adguard:domain"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --ask-become-pass
        -i "{{.INVENTORY}}" -i ansible/inventories/external/hosts.yml
        -e "garage_ui_verify_restart={{.STORAGE_VERIFY_RESTART}}"
        ansible/playbooks/storage-verify.yml

  storage:credentials:
    desc: Show storage and application credentials only in the operator terminal
    vars:
      APPLICATION: '{{.APPLICATION | default "colouring_book_dev"}}'
    cmds:
      - python3 taskfiles/scripts/app/storage-secrets.py credentials --application "{{.APPLICATION}}"

  runner:validate:
    desc: Validate the Docker runner installer and deployment admission tests
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - python3 -m unittest discover -s ansible/roles/gitea-runner/tests -v
      - >-
        ansible-playbook --syntax-check
        -i ansible/inventories/homelab/hosts.example.yml
        -i ansible/inventories/external/hosts.yml
        -e "gitea_admin_password_file=/tmp/gitea-syntax-placeholder"
        ansible/playbooks/gitea-runner.yml

  runner:deploy:
    desc: Install the org Docker runner on red with a hidden sudo password prompt
    deps: [":config:inventory", "adguard:domain", "gitea:secret"]
    cmds:
      - task: runner:validate
      - >-
        ansible-playbook --ask-become-pass
        -i "{{.INVENTORY}}" -i ansible/inventories/external/hosts.yml
        -e "gitea_admin_password_file=$PWD/{{.GITEA_SECRET_FILE}}"
        ansible/playbooks/gitea-runner.yml

  wireguard:secrets:
    internal: true
    cmds:
      - python3 taskfiles/scripts/app/wg-easy-secrets.py

  wireguard:test-fresh:
    desc: Test an isolated fresh install and real per-client firewall traffic with disposable state
    cmds:
      - python3 taskfiles/scripts/app/wg-easy-test-fresh.py

  wireguard:check:
    desc: Preview canonical wg-easy service configuration without router cutover
    deps: [":config:inventory", "wireguard:secrets", "caddy:credentials", "homepage:secrets"]
    cmds:
      - ansible-playbook --check -i "{{.INVENTORY}}" ansible/playbooks/wg-easy.yml

  wireguard:deploy:
    desc: Install or converge wg-easy; existing clients remain runtime state
    deps: [":config:inventory", "wireguard:secrets", "caddy:credentials", "homepage:secrets"]
    cmds:
      - ansible-playbook -i "{{.INVENTORY}}" ansible/playbooks/wg-easy.yml

  wireguard:credentials:
    desc: Show the private wg-easy administrator login in your terminal
    preconditions:
      - sh: test -s .generated/secrets/wg-easy-admin-password
        msg: Deploy wg-easy first
    cmds:
      - python3 taskfiles/scripts/app/wg-easy-secrets.py credentials

  wireguard:verify:
    desc: Verify wg-easy health, native firewall and private administration boundaries
    deps: [":config:inventory"]
    cmds:
      - ansible-playbook -i "{{.INVENTORY}}" ansible/playbooks/wg-easy-verify.yml

  homepage:secrets:
    internal: true
    cmds:
      - python3 taskfiles/scripts/app/homepage-secrets.py

  homepage:validate:
    desc: Validate host reporters snapshot sampling and Homepage playbook wiring
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - python3 -m unittest discover -s ansible/roles/homepage/tests -v
      - node --test ansible/roles/homepage/tests/test-observer.cjs
      - >-
        ansible-playbook --syntax-check
        -i ansible/inventories/homelab/hosts.example.yml
        -i ansible/inventories/external/hosts.yml
        ansible/playbooks/homepage.yml
      - >-
        ansible-playbook --syntax-check
        -i ansible/inventories/homelab/hosts.example.yml
        ansible/playbooks/homepage-refresh.yml

  homepage:check:
    desc: Preview Homepage, scoped observer identities and private dashboard ingress
    deps: [":config:inventory", "caddy:credentials", "homepage:secrets"]
    cmds:
      - task: homepage:validate
      - ansible-playbook --check -i "{{.INVENTORY}}" -i ansible/inventories/external/hosts.yml ansible/playbooks/homepage.yml

  homepage:deploy:
    desc: Deploy the authenticated Homepage dashboard and approved integrations
    deps: [":config:inventory", "caddy:credentials", "homepage:secrets"]
    preconditions:
      - sh: test -s .generated/secrets/adguard-admin-password && test ! -e .generated/secrets/.adguard-rotate.lock
        msg: Existing AdGuard bootstrap secret is required; do not run during password rotation
    cmds:
      - task: homepage:validate
      - ansible-playbook --ask-become-pass -i "{{.INVENTORY}}" -i ansible/inventories/external/hosts.yml ansible/playbooks/homepage.yml

  homepage:refresh:
    desc: Refresh Homepage layout and collectors using previously enrolled identities
    deps: [":config:inventory", "adguard:domain"]
    cmds:
      - task: homepage:validate
      - ansible-playbook -i "{{.INVENTORY}}" ansible/playbooks/homepage-refresh.yml

  homepage:verify:
    desc: Verify Homepage login, live widgets, secret redaction and restricted Caddy reads
    deps: ["adguard:domain"]
    cmds:
      - ansible-playbook -i "{{.INVENTORY}}" ansible/playbooks/homepage-verify.yml

  homepage:credentials:
    desc: Show the private dashboard login (operator use only)
    deps: ["adguard:domain"]
    preconditions:
      - sh: test -s .generated/secrets/homepage-dashboard-password
        msg: Deploy Homepage first
    cmds:
      - python3 taskfiles/scripts/app/homepage-secrets.py credentials

  caddy:credentials:
    internal: true
    preconditions:
      - sh: test -n "${HOMELAB_DOMAIN:-}"
        msg: Set HOMELAB_DOMAIN in the ignored root .envrc
      - sh: test -n "${CADDY_ACME_EMAIL:-}"
        msg: Set CADDY_ACME_EMAIL in the ignored root .envrc
      - sh: test -n "${CLOUDFLARE_ACME_API_TOKEN:-}"
        msg: Set CLOUDFLARE_ACME_API_TOKEN in the ignored root .envrc

  caddy:check:
    desc: Preview the pinned Caddy staging deployment
    deps: [":config:inventory", "caddy:credentials", "gitea:secret", "homepage:secrets"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --check --diff -i "{{.INVENTORY}}"
        -e "caddy_acme_environment=staging"
        -e "caddy_acme_ca={{.ACME_STAGING_CA}}"
        -e "gitea_admin_password_file=$PWD/{{.GITEA_SECRET_FILE}}"
        ansible/playbooks/caddy.yml

  caddy:check-production:
    desc: Preview Caddy changes against the live production certificate state
    deps: [":config:inventory", "caddy:credentials", "gitea:secret", "homepage:secrets"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --check --diff -i "{{.INVENTORY}}"
        -e "caddy_acme_environment=production"
        -e "caddy_acme_ca={{.ACME_PRODUCTION_CA}}"
        -e "gitea_admin_password_file=$PWD/{{.GITEA_SECRET_FILE}}"
        ansible/playbooks/caddy.yml

  caddy:deploy-staging:
    desc: Build Caddy and prove Cloudflare DNS-01 against Let's Encrypt staging
    deps: [":config:inventory", "caddy:credentials", "gitea:secret", "homepage:secrets"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --diff -i "{{.INVENTORY}}"
        -e "caddy_acme_environment=staging"
        -e "caddy_acme_ca={{.ACME_STAGING_CA}}"
        -e "gitea_admin_password_file=$PWD/{{.GITEA_SECRET_FILE}}"
        ansible/playbooks/caddy.yml

  caddy:deploy-production:
    desc: Switch Caddy to a publicly trusted production certificate after staging passes
    deps: [":config:inventory", "caddy:credentials", "gitea:secret", "homepage:secrets"]
    preconditions:
      - sh: test "${HOMELAB_CONFIRM_PRODUCTION_CERTS:-}" = "yes"
        msg: Set HOMELAB_CONFIRM_PRODUCTION_CERTS=yes only after the staging deployment passes
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --diff -i "{{.INVENTORY}}"
        -e "caddy_acme_environment=production"
        -e "caddy_acme_ca={{.ACME_PRODUCTION_CA}}"
        -e "gitea_admin_password_file=$PWD/{{.GITEA_SECRET_FILE}}"
        ansible/playbooks/caddy.yml

  ddns:credentials:
    internal: true
    preconditions:
      - sh: test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
        msg: Set CLOUDFLARE_ACCOUNT_ID in the ignored root .envrc
      - sh: test -n "${CLOUDFLARE_DDNS_API_TOKEN:-}"
        msg: Set CLOUDFLARE_DDNS_API_TOKEN in the ignored root .envrc

  ddns:check:
    desc: Preview the Cloudflare DNS-only WireGuard DDNS updater
    deps: [":config:inventory", "ddns:credentials"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --check --diff -i "{{.INVENTORY}}"
        ansible/playbooks/cloudflare-ddns.yml

  ddns:deploy:
    desc: Deploy and verify Cloudflare DDNS on lab-access-01
    deps: [":config:inventory", "ddns:credentials"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --diff -i "{{.INVENTORY}}"
        ansible/playbooks/cloudflare-ddns.yml

  gitea:secret:
    internal: true
    cmds:
      - taskfiles/scripts/app/gitea-bootstrap-secret.sh

  gitea:check:
    desc: Preview the pinned Docker and Gitea deployment
    deps: [":config:inventory", "adguard:domain", "gitea:secret"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --check --diff -i "{{.INVENTORY}}"
        -e "gitea_admin_password_file=$PWD/{{.GITEA_SECRET_FILE}}"
        ansible/playbooks/gitea.yml

  gitea:deploy:
    desc: Install pinned Docker CE and deploy Gitea on lab-services-01
    deps: [":config:inventory", "adguard:domain", "gitea:secret"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --diff -i "{{.INVENTORY}}"
        -e "gitea_admin_password_file=$PWD/{{.GITEA_SECRET_FILE}}"
        ansible/playbooks/gitea.yml

  gitea:credentials:
    desc: Show the one-time Gitea bootstrap administrator credentials
    preconditions:
      - sh: test -f "{{.GITEA_SECRET_FILE}}"
        msg: Run task apps:gitea:deploy first
    cmds:
      - |
        printf 'Username: homelab-admin\nEmail: admin@gmail.com\nPassword: '
        cat "{{.GITEA_SECRET_FILE}}"
        printf '\nChange this password at first login.\n'

  adguard:secret:
    internal: true
    cmds:
      - bash taskfiles/scripts/app/adguard-bootstrap-secret.sh

  adguard:domain:
    internal: true
    preconditions:
      - sh: test -n "${HOMELAB_DOMAIN:-}"
        msg: Set HOMELAB_DOMAIN in the ignored root .envrc

  adguard:check:
    desc: Preview the parallel AdGuard deployment on lab-access-01
    deps: [":config:inventory", "adguard:domain", "adguard:secret"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --check --diff -i "{{.INVENTORY}}"
        -e "adguard_admin_password_file=$PWD/.generated/secrets/adguard-admin-password"
        ansible/playbooks/adguard.yml

  adguard:deploy:
    desc: Deploy and reconcile the parallel AdGuard resolver at 192.168.1.100
    deps: [":config:inventory", "adguard:domain", "adguard:secret"]
    preconditions:
      - sh: test ! -e .generated/secrets/.adguard-rotate.lock
        msg: AdGuard password rotation is in progress; do not deploy concurrently
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --diff -i "{{.INVENTORY}}"
        -e "adguard_admin_password_file=$PWD/.generated/secrets/adguard-admin-password"
        ansible/playbooks/adguard.yml

  adguard:verify:
    desc: Verify private names, filtering, and public DNS on the new AdGuard resolver
    deps: ["adguard:domain"]
    cmds:
      - bash taskfiles/scripts/app/adguard-verify.sh

  adguard:credentials:
    desc: Show the replacement AdGuard administrator credentials and HTTPS URL
    deps: ["adguard:domain"]
    preconditions:
      - sh: test -s .generated/secrets/adguard-admin-password
        msg: Run task apps:adguard:deploy first
    cmds:
      - |
        printf 'Username: server\nPassword: '
        cat .generated/secrets/adguard-admin-password
        printf '\nHTTPS: https://adguard.home.%s/ (client DNS must use 192.168.1.100)\n' "$HOMELAB_DOMAIN"
        printf 'Fallback tunnel: ssh -L 3000:192.168.1.100:3000 user@192.168.1.101\n'

  adguard:rotate-password:
    desc: Rotate the AdGuard administrator password with guest rollback and DNS verification
    deps: [":config:inventory", "adguard:domain"]
    preconditions:
      - sh: test "${HOMELAB_CONFIRM_ADGUARD_ROTATION:-}" = "yes"
        msg: Set HOMELAB_CONFIRM_ADGUARD_ROTATION=yes for a brief DNS interruption
      - sh: test -s .generated/secrets/adguard-admin-password
        msg: Deploy AdGuard before rotating its administrator password
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - bash taskfiles/scripts/app/adguard-rotate-password.sh

  hermes:secret:
    internal: true
    cmds:
      - python3 taskfiles/scripts/app/hermes-bootstrap-secret.py

  hermes:check:
    desc: Preview the provider-neutral Hermes dashboard deployment
    deps: [":config:inventory", "adguard:domain", "hermes:secret"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --check --diff -i "{{.INVENTORY}}"
        -e "hermes_dashboard_secret_file=$PWD/.generated/secrets/hermes-dashboard.json"
        ansible/playbooks/hermes.yml

  hermes:deploy:
    desc: Deploy the authenticated Hermes dashboard on lab-agents-01
    deps: [":config:inventory", "adguard:domain", "hermes:secret"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - >-
        ansible-playbook --diff -i "{{.INVENTORY}}"
        -e "hermes_dashboard_secret_file=$PWD/.generated/secrets/hermes-dashboard.json"
        ansible/playbooks/hermes.yml

  hermes:credentials:
    desc: Show the local Hermes dashboard login and HTTPS URL
    deps: ["adguard:domain"]
    preconditions:
      - sh: test -s .generated/secrets/hermes-dashboard.json
        msg: Run task apps:hermes:deploy first
    cmds:
      - |
        jq -r '"Username: \(.username)\nPassword: \(.password)"' .generated/secrets/hermes-dashboard.json
        printf 'HTTPS: https://hermes.home.%s/ (client DNS must use 192.168.1.100)\n' "$HOMELAB_DOMAIN"

  hermes:git:check:
    desc: Preview Hermes Git identity, scoped Gitea API, and private DNS
    deps: [":config:inventory", "adguard:domain"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - ansible-playbook --check --diff -i "{{.INVENTORY}}" ansible/playbooks/hermes-git.yml

  hermes:git:deploy:
    desc: Enable Hermes Git SSH plus scoped Gitea issue and pull-request access
    deps: [":config:inventory", "adguard:domain"]
    cmds:
      - mkdir -p "{{.LOCAL_TEMP}}"
      - ansible-playbook --diff -i "{{.INVENTORY}}" ansible/playbooks/hermes-git.yml
