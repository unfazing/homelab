version: "3"

silent: true

vars:
  IMAGE_DIR: packer/images/ubuntu-26.04

tasks:
  init:
    desc: Install the pinned Packer Proxmox plugin
    cmds:
      - packer init "{{.IMAGE_DIR}}"

  format:
    desc: Check the Ubuntu image definition formatting
    cmds:
      - packer fmt -check -recursive "{{.IMAGE_DIR}}"

  validate:
    desc: Validate the Ubuntu image with an ephemeral key and rendered NoCloud seed
    deps: [init]
    cmds:
      - ./scripts/packer-image.sh validate

  build:
    desc: Build Ubuntu 26.04 template VM 9000 (changes Proxmox)
    deps: [init]
    cmds:
      - task: format
      - ./scripts/packer-image.sh build

  verify:
    desc: Clone and verify template VM 9000, then destroy test VM 9900
    cmds:
      - ./scripts/verify-image.sh
