version: "3"

silent: true

vars:
  TERRAFORM_DIR: terraform
  VAR_FILE: deployment.tfvars.json

tasks:
  init:
    desc: Initialize the three-VM Terraform deployment
    cmds:
      - terraform -chdir="{{.TERRAFORM_DIR}}" init -input=false

  format:
    desc: Check Terraform deployment formatting
    cmds:
      - terraform -chdir="{{.TERRAFORM_DIR}}" fmt -check -recursive

  validate:
    desc: Validate the three-VM Terraform deployment
    deps: [init]
    cmds:
      - terraform -chdir="{{.TERRAFORM_DIR}}" validate

  plan:
    desc: Plan the three-VM Terraform deployment
    deps: [init]
    preconditions:
      - sh: test -f "{{.TERRAFORM_DIR}}/{{.VAR_FILE}}"
        msg: Missing terraform/deployment.tfvars.json
    cmds:
      - scripts/host/terraform-mapping-role.sh status
      - terraform -chdir="{{.TERRAFORM_DIR}}" plan -input=false -var-file="{{.VAR_FILE}}"

  apply:
    desc: Apply the three-VM Terraform deployment
    deps: [":host:mapping-access"]
    preconditions:
      - sh: test "${HOMELAB_STATIC_RANGE_RESERVED:-}" = "yes"
        msg: Set HOMELAB_STATIC_RANGE_RESERVED=yes only after the F620 DHCP pool ends at or below 192.168.1.99
    cmds:
      - terraform -chdir="{{.TERRAFORM_DIR}}" init -input=false
      - terraform -chdir="{{.TERRAFORM_DIR}}" apply -var-file="{{.VAR_FILE}}"

  output:
    desc: Show machine-readable Terraform deployment outputs
    cmds:
      - terraform -chdir="{{.TERRAFORM_DIR}}" output -json
